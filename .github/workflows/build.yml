# Compila o firmware automaticamente a cada envio para o GitHub.
# Se o codigo parar de compilar, o GitHub avisa com um X vermelho.

name: Compilacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Reaproveitar downloads anteriores
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: pip install --upgrade platformio

      - name: Compilar o firmware
        run: pio run -d projeto-fisico-sensor-rios
